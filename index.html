      {id:9,title:"Freshdesk",category:"Customer & IT Support Platform",tags:["Configure","Maintain"],logoSlug:"freshdesk",fallback:"FD",color:"#25C16F",description:"A helpdesk is only as good as the system behind it. Freshdesk configured properly — ticket categories, SLA policies, escalation rules, and a knowledge base that deflects the repeat stuff before it becomes a ticket. Track what matters, fix what keeps breaking.",projects:[{title:"Helpdesk Setup & Knowledge Base Build",status:"Completed",scope:"Organisation-wide IT support",summary:"Configured Freshdesk as the IT helpdesk platform including ticket forms by category (hardware, network, account access, software), SLA policies by priority, and automated escalation rules. Built a knowledge base of 80+ articles covering common end-user and infrastructure issues to enable self-service and Level 1 resolution.",outcomes:["Ticket deflection rate of 28% via self-service knowledge base","SLA breach rate dropped from 18% to under 4% within 60 days","Level 1 resolution rate improved by 40%","Average first response time reduced from 4 hours to 45 minutes"],tech:["Freshdesk","SLA Policies","Ticket Automation","Knowledge Base","Canned Responses","Reporting Dashboards","Email & Portal Integration"]}]},
      {id:10,title:"GFI FaxMaker",category:"Cloud Fax & Unified Messaging",tags:["Setup","Configure","Maintain"],logoSlug:null,fallback:"GFI",color:"#E85D26",description:"Not glamorous, but in regulated environments fax reliability is non-negotiable. GFI FaxMaker integrated with Exchange and Office 365 — fax-to-email routing, centralised logging, no single point of failure. The kind of infrastructure that just works and never gets mentioned.",projects:[{title:"GFI FaxMaker Enterprise Deployment",status:"Completed",scope:"Organisation-wide fax infrastructure",summary:"Deployed GFI FaxMaker with Microsoft Exchange, replacing legacy analogue fax lines. Configured fax-to-email routing and centralised logging for compliance.",outcomes:["Eliminated physical fax hardware across 3 offices","Fax delivery reliability improved to 99.6%","Reduced fax-related support tickets by 70%"],tech:["GFI FaxMaker","Microsoft Exchange","Office 365 Connector","DID Routing","SMTP Gateway"]}]},
      {id:11,title:"Google Cloud Platform",category:"Cloud Infrastructure & Services",tags:["Setup","Configure","Maintain"],logoSlug:"googlecloud",fallback:"GCP",color:"#1A73E8",description:"GCP built right from the start — org hierarchy, shared VPC, IAM with least privilege, Compute Engine, Cloud Storage, Cloud Operations Suite. The kind of landing zone where new projects inherit the right controls automatically, not as an afterthought.",projects:[{title:"GCP Landing Zone Build-Out",status:"Completed",scope:"12 projects · 3 environments",summary:"Designed and deployed a secure GCP Landing Zone. Established org hierarchy, shared VPC, centralized logging, Cloud Armor WAF, and IAM least-privilege baselines.",outcomes:["Passed GCP Security Command Center baseline audit","All new projects inherit security controls automatically"],tech:["GCP Organizations","Shared VPC","Cloud Armor","IAM","Cloud Logging","Terraform"]},{title:"Google Workspace to GCP Identity Bridge",status:"Completed",scope:"900 user accounts",summary:"Federated Google Workspace identity with GCP. Configured Cloud Identity, mapped Workspace groups to GCP roles, and enforced context-aware access policies.",outcomes:["Single identity source for all GCP and Workspace resources","Context-aware access blocked 100% of off-network admin attempts"],tech:["Cloud Identity","Context-Aware Access","Workspace Groups","IAM Bindings"]}]},
      {id:12,title:"HaloPSA",category:"IT Service Management & PSA",tags:["Configure","Maintain"],logoSlug:null,fallback:"HL",color:"#6C2BD9",description:"Running 100+ client organisations through a single PSA platform takes more than just good tooling — it takes a well-configured one. HaloPSA handling tickets, contracts, SLAs, asset tracking, and billing, with automation rules that mean most routing happens without anyone touching it.",projects:[{title:"MSP Service Desk Operations via HaloPSA",status:"Ongoing",scope:"Multi-client MSP · 100+ client organisations",summary:"Use HaloPSA as the central ITSM and PSA platform for managing service desk operations across a portfolio of 100+ client organisations. Configured SLA tiers per client contract, automated ticket routing by client and issue type, and built reporting dashboards for monthly service reviews.",outcomes:["SLA compliance maintained above 97% across all client tiers","Automated routing eliminated manual ticket assignment","Monthly client service reports generated in under 5 minutes","Asset register maintained for 2,000+ managed devices"],tech:["HaloPSA","SLA Management","Contract Management","Asset Tracking","Ticket Automation","Client Portals","Reporting & Dashboards"]},{title:"Change & Problem Management Workflow Build",status:"Completed",scope:"Internal IT change control process",summary:"Designed and implemented a formal change management workflow within HaloPSA aligned to ITIL principles. Configured change advisory board (CAB) approval stages, risk assessment templates, and post-implementation review tracking.",outcomes:["100% of changes tracked with approvals and rollback plans documented","Emergency change process established with sub-2-hour approval SLA","Zero unauthorised changes in production post-implementation"],tech:["HaloPSA","Change Management","ITIL Workflows","CAB Approvals","Risk Templates","Problem Records"]}]},
      {id:13,title:"Jamf",category:"Apple Device Management",tags:["Setup","Configure","Maintain"],logoSlug:"jamf",fallback:"JF",color:"#1A1A1A",description:"Zero-touch Mac deployment: box arrives, user powers it on, everything's there. That's what a properly built Jamf Pro environment looks like — ADE enrollment, config profiles, software deployment, scripted automation. No helpdesk call, no setup time.",projects:[{title:"Global Mac Fleet Deployment",status:"Completed",scope:"600 Macs across 8 locations",summary:"Architected zero-touch Mac deployment using Jamf Pro and Apple Business Manager. Devices arrive preconfigured with all required software, security baselines, and user profiles.",outcomes:["Zero-touch setup: device ready in under 15 minutes","Helpdesk Mac tickets reduced by 58%"],tech:["Jamf Pro","ADE/DEP","ABM","PreStage Enrollments","Self Service","Bash Scripting"]},{title:"macOS Security Hardening & Compliance",status:"Completed",scope:"All macOS endpoints",summary:"Implemented CIS Level 2 benchmarks via Jamf configuration profiles and custom scripts. Automated compliance reporting and enforced FileVault encryption.",outcomes:["CIS compliance score: 94%","Full disk encryption enforced fleet-wide"],tech:["CIS Benchmarks","FileVault","Configuration Profiles","Jamf Compliance Reporter","Python"]}]},
      {id:14,title:"Jira",category:"Project & Issue Tracking",tags:["Configure","Maintain"],logoSlug:"jira",fallback:"JR",color:"#0052CC",description:"Work that isn't tracked doesn't exist. Jira keeps the engineering backlog visible, change requests auditable, and incidents moving — custom workflows, SLA policies, dashboards that mean something. Confluence alongside it so the knowledge doesn't live in someone's head.",projects:[{title:"IT Engineering Backlog & Sprint Management",status:"Ongoing",scope:"12-person IT engineering team",summary:"Implemented Jira as the primary project and task tracking platform for the infrastructure engineering team. Built custom workflows for incidents, change requests, and project delivery. Configured dashboards and reports for sprint velocity, backlog health, and SLA tracking.",outcomes:["Engineering backlog visibility improved — 100% of work tracked","Sprint velocity increased 30% within first quarter","Change request approvals tracked end-to-end with full audit trail"],tech:["Jira Software","Jira Service Management","Custom Workflows","Dashboards","Confluence Integration","Automation Rules"]},{title:"P1 Incident Tracking & Post-Mortem Workflow",status:"Completed",scope:"All P1/P2 incidents",summary:"Designed a structured P1/P2 incident workflow in Jira linking real-time incident tickets to post-mortem action items. Automated escalation notifications and SLA breach alerts.",outcomes:["Post-mortem completion rate reached 100%","Average time-to-post-mortem reduced from 2 weeks to 48 hours","Recurring incident patterns identified and eliminated within 90 days"],tech:["Jira Service Management","Automation Rules","SLA Policies","Linked Issues","Confluence Post-Mortems"]}]},
      {id:15,title:"Microsoft 365",category:"Cloud Productivity & Collaboration Suite",tags:["Setup","Configure","Maintain"],logoSlug:"microsoft365",fallback:"M365",color:"#D83B01",description:"Exchange Online, SharePoint, Teams, OneDrive — the full M365 stack, not just the surface. Tenant-to-tenant migrations, Teams Direct Routing replacing legacy PBX, licensing and security policy built for scale. The kind of experience that comes from doing it properly, not just once.",projects:[{title:"M365 Tenant Migration & Consolidation",status:"Completed",scope:"1,800 users · 2 tenants merged",summary:"Led post-acquisition M365 tenant-to-tenant migration. Migrated Exchange mailboxes, SharePoint sites, Teams, and OneDrive data.",outcomes:["Zero data loss across 1.8TB migrated","All users operational within 48hr cutover","Unified GAL and Teams federation achieved Day 1"],tech:["BitTitan MigrationWiz","SPMT","Exchange Hybrid","Azure AD Connect","PowerShell"]},{title:"Teams Voice & Telephony Rollout",status:"Completed",scope:"450 users replacing legacy PBX",summary:"Replaced on-prem Avaya PBX with Microsoft Teams Direct Routing. Deployed SBC, configured dial plans, auto attendants, and call queues.",outcomes:["$120K annual savings vs. legacy PBX","99.9% call quality uptime post-cutover"],tech:["Teams Direct Routing","SBC","Dial Plans","Call Queues","Emergency Calling"]}]},
      {id:16,title:"Microsoft Azure",category:"Cloud Infrastructure & Security",tags:["Setup","Configure","Maintain"],logoSlug:"microsoftazure",fallback:"AZ",color:"#0078D4",description:"A cloud environment that surprises no one — that's the target. Azure built end to end: networking, hybrid identity through Entra ID, Conditional Access enforcing Zero Trust, Sentinel as the SIEM pulling everything together. Governance and compliance baked in from the start, not bolted on later.",projects:[{title:"Azure Hybrid Infrastructure & Networking",status:"Completed",scope:"Enterprise · Hybrid on-prem to Azure",summary:"Designed and deployed a hybrid Azure environment connecting on-premises data centres to Azure via Site-to-Site VPN and ExpressRoute. Built VNets, subnets, NSGs, and Azure Firewall policies. Configured Azure AD Connect for hybrid identity and Conditional Access policies for Zero Trust access control.",outcomes:["Seamless hybrid identity across on-prem AD and Entra ID","Zero-trust Conditional Access enforced for all cloud resources","Network segmentation achieved — workloads isolated by NSG and Azure Firewall","Site-to-Site VPN delivering 99.95% uptime"],tech:["Azure VNet","NSGs","Azure Firewall","Site-to-Site VPN","ExpressRoute","Azure AD Connect","Entra ID","Conditional Access","Azure Bastion"]},{title:"Azure Security Operations & Compliance",status:"Ongoing",scope:"Cloud-wide · All Azure workloads",summary:"Implemented Microsoft Defender for Cloud and Microsoft Sentinel as the centralised SIEM/SOAR platform. Configured threat detection rules, analytics workbooks, and automated incident response playbooks. Enforced Azure Policy and Blueprints for compliance with CIS benchmarks and organisational standards.",outcomes:["Defender for Cloud Secure Score improved from 42% to 87%","Sentinel SIEM ingesting 2M+ events/day with automated triage","Mean time to detect (MTTD) reduced from hours to under 15 minutes","Azure Policy enforcing compliance on 100% of subscriptions"],tech:["Microsoft Defender for Cloud","Microsoft Sentinel","Azure Monitor","Log Analytics","Azure Policy","Blueprints","KQL","Logic Apps (SOAR)","CIS Benchmarks"]}]},
      {id:17,title:"Microsoft Hyper-V",category:"Virtualisation Infrastructure",tags:["Setup","Configure","Maintain"],logoSlug:"microsoft",fallback:"HV",color:"#0067B8",description:"When vSphere isn't the answer, Hyper-V is. Failover clusters, Hyper-V Replica for DR, live migrations — the full Windows Server virtualisation stack, built properly and managed through SCVMM where the scale demands it.",projects:[{title:"Hyper-V Failover Cluster Build",status:"Completed",scope:"3-node cluster · 60 VMs",summary:"Designed and deployed a 3-node Hyper-V failover cluster with Cluster Shared Volumes, Hyper-V Replica to offsite DR host, and migrated 60 VMs from legacy ESXi.",outcomes:["VM failover achieved in under 30 seconds","60 VMs migrated with zero data loss","DR replica lag maintained under 5 minutes"],tech:["Hyper-V","Windows Server Failover Clustering","CSV","Hyper-V Replica","SCVMM","Live Migration"]}]},
      {id:18,title:"Microsoft Intune",category:"Mobile Device & Application Management",tags:["Setup","Configure","Maintain"],logoSlug:"microsoftintune",fallback:"IN",color:"#0078D4",description:"Unmanaged devices don't get in — that's the baseline. Intune across Windows, macOS, iOS, and Android: compliance policies, app deployment, Conditional Access. Hybrid and cloud-only environments, built so the endpoint estate is always in a known state.",projects:[{title:"Cross-Platform Endpoint Modernization",status:"Completed",scope:"2,400 devices",summary:"Migrated 2,400 endpoints from legacy SCCM to Microsoft Intune. Built compliance policies, configuration profiles, and conditional access rules for all platforms.",outcomes:["Reduced endpoint compliance gaps from 34% to 2%","Full patch compliance within 72 hrs","Retired SCCM infrastructure saving $80K/yr"],tech:["Intune","SCCM Migration","Autopilot","Defender for Endpoint","Conditional Access"]},{title:"App Deployment & Patching Pipeline",status:"Ongoing",scope:"All Windows & macOS endpoints",summary:"Built and maintain an automated application deployment and patching pipeline through Intune. Created Win32 app packages and configured update rings.",outcomes:["95%+ patch rate maintained monthly","App deployment time cut from days to hours"],tech:["Win32 Apps","PowerShell","Update Rings","Company Portal"]}]},
      {id:19,title:"Okta",category:"Identity & Access Management",tags:["Setup","Configure","Maintain"],logoSlug:"okta",fallback:"OK",color:"#00297A",description:"Identity done once, done right. Okta as the central identity layer — SSO across 40+ SaaS and on-prem apps, MFA enforced, and SCIM provisioning connected to HR so new starters hit the ground running and leavers are cut off automatically.",projects:[{title:"Enterprise SSO Rollout",status:"Completed",scope:"1,200 users · 40+ apps",summary:"Led full Okta deployment replacing legacy AD FS. Integrated 40+ SaaS apps with SAML/OIDC SSO and established SCIM provisioning with Workday HR.",outcomes:["Reduced login-related helpdesk tickets by 64%","100% MFA adoption across org","Cut onboarding time from 3 days to 4 hours"],tech:["SAML 2.0","SCIM","Okta Workflows","AD Connect","MFA"]},{title:"Zero Trust Access Policy Redesign",status:"Completed",scope:"All remote workers",summary:"Redesigned Okta adaptive MFA and device trust policies based on device posture, location risk, and user behavior. Integrated with CrowdStrike for real-time signals.",outcomes:["Blocked 99.8% of credential-stuffing attempts","Zero exceptions needed for compliant users"],tech:["Adaptive MFA","Device Trust","CrowdStrike Integration","Risk Engine"]}]},
      {id:20,title:"RingCentral",category:"Cloud Communications & UCaaS",tags:["Setup","Configure","Maintain"],logoSlug:"ringcentral",fallback:"RC",color:"#FF6600",description:"Legacy PBX out, RingCentral MVP in — and users barely notice the switch, which is exactly the point. Call routing, auto-attendants, call queues, M365 integration. The kind of migration where the most common feedback is silence.",projects:[{title:"RingCentral UCaaS Migration",status:"Completed",scope:"350 users · 4 office locations",summary:"Led full PBX-to-RingCentral MVP migration across 4 offices. Ported all DDI numbers, configured auto-attendants, call queues, and ring groups. Integrated with Microsoft 365.",outcomes:["350 users migrated with zero business-hours downtime","DDI porting completed within 2 weeks","Call quality scores averaged 4.4/5"],tech:["RingCentral MVP","SIP","Microsoft 365 Integration","Auto-Attendant","Call Queues","DDI Porting"]}]},

      {id:22,title:"SonicWall",category:"Network Security & Firewall",tags:["Setup","Configure","Maintain"],logoSlug:null,fallback:"SW",color:"#FF6600",description:"SonicWall for SMB and mid-market perimeter security — TZ and NSa series deployed across multiple sites, IPS, content filtering, Capture ATP sandboxing, SSL-VPN for remote access. NSM keeps policy consistent everywhere so one change doesn't become six firewall sessions.",projects:[{title:"SonicWall NGFW Multi-Site Deployment",status:"Completed",scope:"6 sites · Internet edge & branch security",summary:"Deployed SonicWall TZ and NSa series firewalls across 6 locations. Configured site-to-site VPN mesh, application control policies, intrusion prevention (IPS), content filtering, and SSL-VPN for remote access. Centralised management via SonicWall Network Security Manager (NSM).",outcomes:["IPS blocked 8,000+ threats within first 60 days","SSL-VPN enabled for 200+ remote users with MFA","Centralised policy management across all 6 sites","Zero firewall-related security incidents post-deployment"],tech:["SonicWall TZ Series","SonicWall NSa","SonicOS","Site-to-Site VPN","SSL-VPN","IPS","App Control","Capture ATP","Content Filtering","NSM"]}]},

      {id:24,title:"Team Building & Management",category:"Leadership & Organizational Development",tags:["Management"],logoSlug:null,fallback:"TM",color:"#2E4057",description:"Teams don't fix themselves. Hiring the right people, building proper Tier 1/2/3 structure, setting goals that mean something — and creating an environment where people actually stay. That's the leadership side of what I bring.",projects:[{title:"IT Team Rebuild & Tier Structure",status:"Completed",scope:"12-person IT department",summary:"Rebuilt a dysfunctional IT team following high attrition. Hired 5 engineers, restructured into Tier 1/2/3 tiers, and introduced a skills matrix.",outcomes:["MTTR reduced 55% within 90 days","Team NPS jumped from 28 to 71 over 6 months","Zero unplanned attrition in 12 months post-rebuild"],tech:["RACI Matrix","Jira Service Management","Skills Matrix","OKRs","Confluence"]},{title:"IT Onboarding & Knowledge Base Program",status:"Ongoing",scope:"All IT staff",summary:"Designed structured onboarding for new IT engineers and built a living knowledge base in Confluence covering all major systems.",outcomes:["New hires productive 3x faster","Knowledge base has 200+ articles with 90%+ freshness"],tech:["Confluence","Loom","ITSM Runbooks","Slack"]}]},
      {id:25,title:"Troubleshooting",category:"Systems & Infrastructure Diagnostics",tags:["Maintain"],logoSlug:null,fallback:"TS",color:"#4A4A4A",description:"The problems that have been open for months, the intermittent ones nobody can reproduce, the P1 at 2am — those are the situations this experience is built for. Methodical, layer by layer: event logs, packet captures, performance data, vendor diagnostics. Whatever it takes to find the actual root cause.",projects:[{title:"P1 Incident: Domain-Wide Authentication Outage",status:"Completed",scope:"1,800 affected users",summary:"Led incident response for P1 domain-wide authentication failure. Diagnosed root cause as a misconfigured Okta LDAP agent update. Restored service by rolling back agent version.",outcomes:["Full service restored in 4.5 hours","Post-mortem with root cause + 12 action items","Same failure now caught in under 3 minutes"],tech:["Okta LDAP Agent","Active Directory","Event Viewer","Wireshark","Incident Command"]},{title:"Chronic Network Latency Root Cause Analysis",status:"Completed",scope:"HQ campus network",summary:"Investigated months-long intermittent latency at a 400-person HQ. Traced issue to a failing NIC causing STP topology changes using packet captures and SolarWinds NPM.",outcomes:["Issue eliminated after 3 months of open tickets","Documented full diagnostic methodology for NOC team"],tech:["Wireshark","SolarWinds NPM","STP Analysis","SNMP","Port Mirroring"]}]},

                </div>
                <div className="mo-body">
                  <p style={{fontSize:14,color:"#555",lineHeight:1.75,marginBottom:24}}>{mSkill.description}</p>
                  <div style={{background:"#F8F8F7",borderRadius:10,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <span style={{fontSize:13,color:"#888"}}>Related Projects</span>
                    <span style={{fontSize:13,fontWeight:700,color:"#1a1a1a"}}>{mSkill.projects.length}</span>
                  </div>
                  <button className="done-btn" onClick={()=>setSkillModal(null)}>Done</button>
                </div>
              </div>
            </div>
          )}

          {/* PROJECT MODAL */}
          {pSkill && pProj && (
            <div className="mo-bg" onClick={()=>setProjModal(null)}>
              <div className="mo-box" onClick={e=>e.stopPropagation()}>
                <div className="mo-head">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:36,height:36,background:"#F5F5F4",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",padding:8}}>
                        <BrandLogo slug={pSkill.logoSlug} fallback={pSkill.fallback} color={pSkill.color} size={20}/>
                      </div>
                      <span style={{fontSize:13,color:"#888",fontWeight:500}}>{pSkill.title}</span>
                    </div>
                    <button className="mo-close" onClick={()=>setProjModal(null)}>✕</button>
                  </div>
                  <div style={{fontSize:20,fontWeight:800,color:"#1a1a1a",letterSpacing:"-0.02em",lineHeight:1.2,marginBottom:12}}>{pProj.title}</div>
                  <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                    <span className="proj-status" style={{background:STATUS_STYLE[pProj.status]?.bg,color:STATUS_STYLE[pProj.status]?.color}}>
                      <div style={{width:5,height:5,borderRadius:"50%",background:STATUS_STYLE[pProj.status]?.dot}}/>
                      {pProj.status}
                    </span>
                    <span style={{fontSize:13,color:"#bbb"}}>📌 {pProj.scope}</span>
                  </div>
                </div>
                <div className="mo-body">
                  <div style={{marginBottom:24}}>
                    <div className="mo-section-title">Overview</div>
                    <p style={{fontSize:14,color:"#555",lineHeight:1.75}}>{pProj.summary}</p>
                  </div>
                  <div style={{marginBottom:24}}>
                    <div className="mo-section-title">Key Outcomes</div>
                    {pProj.outcomes.map((o,i)=>(
                      <div key={i} className="mo-outcome">
                        <div className="mo-outcome-dot">
                          <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 2.5" stroke="#1a1a1a" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </div>
                        <span style={{fontSize:13,color:"#555",lineHeight:1.6}}>{o}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{marginBottom:8}}>
                    <div className="mo-section-title">Technologies</div>
                    <div className="mo-tech">
                      {pProj.tech.map((t,i)=><span key={i} className="mo-tech-pill">{t}</span>)}
                    </div>
                  </div>
                  <button className="done-btn" onClick={()=>setProjModal(null)}>Done</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
